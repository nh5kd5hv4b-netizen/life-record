<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活記録</title>
  <style>
    .memoArea{
      width: 100%;
    }
    .memoHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .buttonArea{
      display:flex;
      justify-content:flex-end;
      margin-top:5px;
    }
    .emojiArea{
      width:100%;
      box-sizing:border-box;
      display:flex;
      flex-wrap:wrap;
    }
    .emojiArea button{
      width:100px;
      height:100px;
      font-size:70px;

      display:flex;
      justify-content:center;
      align-items:center;
    }
    #memo{
      width:100%;
      box-sizing:border-box;
      resize:none;
      padding:5px;
      font-size:32px;

      display:flex;
      justify-content:center;
      align-items:center;
    }
    .inputRow{
      display:flex;
      align-items:center;
    }
    .sleepArea{
      display:flex;
      align-items:center;
    }
    .sleepArea input{
      width:120px;
      height: 50px;
      font-size: 40px;
      box-sizing: border-box;
    }
    .sleepButtons{
      display:flex;
      flex-direction:column;
      gap:5px;
    }
    .sleepButtons button{
        width:30px;
        height:20px;
        font-size:18px;

        display:flex;
        justify-content:center;
        align-items:center;
    }
    select{
      height:50px;
      width:50px;
      font-size:40px;
    }
    label{
      font-size:50px;
    }
    button{
      width: 100px;
      height: 50px;
      font-size: 40px;

      display:flex;
      justify-content:center;
      align-items:center;
    }
  </style>
</head>
<body>
<form>
<p id="date"></p>
<div class="inputRow">
  <div class="item1">
  <label for="condition">💪</label>
  <select id="condition">
    <option value="">-</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>  
  </select>
  </div>
  <div class="item2">
  <label for="mood">😊</label>
  <select id="mood">
    <option value="">-</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
  </div>
  <div class="sleepArea">
    <label for="sleep">💤</label>
    <input 
      type="number"
      id="sleep"
      value="6"
      step="0.5"
    >
    <div class="sleepButtons">
    <button type="button" onclick="sleep.stepDown()">-</button>
    <button type="button" onclick="sleep.stepUp()">+</button>
    </div>
  </div>
</div>
<div class="memoArea">
  <div class="memoHeader">
    <p>メモ</p>
    <button type="button" onclick="goBack()">戻る</button>
  </div>

  <textarea id="memo" rows="10" wrap="off"></textarea>

  <div class="buttonArea">
  <button type="button" onclick="saveRecord()">保存</button>
  </div>
  <br>
  <div class="emojiArea">
  <button type="button" onclick="addEmoji('🧺')">🧺</button>
  <button type="button" onclick="addEmoji('🛒')">🛒</button>
  <button type="button" onclick="addEmoji('🧹')">🧹</button>
  <button type="button" onclick="addEmoji('🍽️')">🍽️</button>
  <button type="button" onclick="addEmoji('📞')">📞</button>
  <button type="button" onclick="addEmoji('💬')">💬</button>
  <button type="button" onclick="addEmoji('💧')">💧</button>
  <button type="button" onclick="addEmoji('🗑️')">🗑️</button>
  <button type="button" onclick="addEmoji('🎨')">🎨</button>
  <button type="button" onclick="addEmoji('💻')">💻</button>
  <button type="button" onclick="addEmoji('🤔')">🤔</button>
  <button type="button" onclick="addEmoji('💤')">💤</button>
  <button type="button" onclick="addEmoji('🚶')">🚶</button>
  <button type="button" onclick="addEmoji('🏥')">🏥</button>
  <button type="button" onclick="addEmoji('⭐')">⭐</button>
  </div>
</div>
<br><br><br><br><br><br>
<button type="button" onclick="localStorage.clear()">削除</button>
</form>

<script>
const queryString=location.search;
  
const params=new URLSearchParams(queryString);
const date=params.get("date");
const dateText=document.getElementById("date");
dateText.textContent=date;


function addEmoji(emoji){
  const memo=document.getElementById("memo");

  const cursorPosition=memo.selectionStart;

  const beforeText=memo.value.slice(0,cursorPosition);
  const afterText=memo.value.slice(cursorPosition);
  memo.value=beforeText+emoji+afterText;

  memo.focus();
  memo.setSelectionRange(
    cursorPosition+emoji.length,
    cursorPosition+emoji.length
  );
}
function saveRecord(){
  const condition=document.getElementById("condition").value;
  const mood=document.getElementById("mood").value;
  const memo=document.getElementById("memo").value;
  const sleep=document.getElementById("sleep").value;

  const record={
    date,
    condition,
    mood,
    memo,
    sleep
  }
  const data=JSON.stringify(record);
  localStorage.setItem(date,data);
  goBack();
}

const data=localStorage.getItem(date);
if(data){
  const record=JSON.parse(data);

  document.getElementById("condition").value=record.condition;
  document.getElementById("mood").value=record.mood;
  document.getElementById("memo").value=record.memo;
  document.getElementById("sleep").value=record.sleep;
}

function goBack(){
  location.href="index.html";
}
</script>

</body>
</html>
